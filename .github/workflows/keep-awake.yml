name: Keep app awake

# Streamlit Community Cloud puts apps to sleep after a stretch with no visitors.
# This opens the live app in a headless browser every 4 hours, like a real visit,
# and clicks the wake button if the app has already gone to sleep.

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, 17 minutes past the hour
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  visit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_URL: https://batch-monitor.streamlit.app
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install a headless browser
        timeout-minutes: 6
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app and wake it if needed
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60_000)
              page.wait_for_timeout(8_000)

              woke = False
              for frame in page.frames:  # the button can sit inside a frame
                  button = frame.get_by_role("button", name="Yes, get this app back up!")
                  if button.count():
                      button.first.click()
                      woke = True
                      break

              if woke:
                  print("App was asleep. Clicked the wake button.")
                  page.wait_for_timeout(90_000)  # give it time to start
              else:
                  print("App was already awake.")
                  page.wait_for_timeout(20_000)  # stay long enough to count as a visit
              browser.close()
          PY
