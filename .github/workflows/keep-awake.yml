name: Keep app awake

# Streamlit Community Cloud puts apps to sleep after a stretch with no visitors.
# Every 4 hours this opens the live app in a headless browser, like a real visit,
# wakes it if it has gone to sleep, and fails if the dashboard doesn't render,
# so a broken app shows up as a failed run.

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, 17 minutes past the hour
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  visit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_URL: https://batch-monitor.streamlit.app
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        timeout-minutes: 6
        run: pip install playwright

      - name: Visit the app and check the dashboard renders
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import os, sys, time
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          TITLE = "Batch performance monitor"

          def dashboard_found(page):
              for frame in page.frames:  # the dashboard sits inside nested frames
                  try:
                      if frame.get_by_text(TITLE).count():
                          return True
                  except Exception:
                      pass
              return False

          with sync_playwright() as p:
              browser = p.chromium.launch(channel="chrome")  # Chrome comes preinstalled on the runner
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60_000)
              page.wait_for_timeout(8_000)

              for frame in page.frames:
                  try:
                      button = frame.get_by_role("button", name="Yes, get this app back up!")
                      if button.count():
                          button.first.click()
                          print("App was asleep. Clicked the wake button.")
                          break
                  except Exception:
                      pass

              deadline = time.time() + 150
              while time.time() < deadline and not dashboard_found(page):
                  page.wait_for_timeout(5_000)

              ok = dashboard_found(page)
              if ok:
                  print("Dashboard rendered.")
                  page.wait_for_timeout(15_000)  # stay long enough to count as a visit
              else:
                  print("Dashboard did not render within 150 seconds.")
              browser.close()
              sys.exit(0 if ok else 1)
          PY
