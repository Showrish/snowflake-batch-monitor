name: Keep app awake

# Streamlit Community Cloud puts apps to sleep after a stretch with no visitors.
# Every 4 hours this opens the live app in a headless browser, like a real visit,
# wakes it if it has gone to sleep, and fails if the dashboard doesn't render,
# so a broken app shows up as a failed run. Each run keeps a screenshot of what
# the browser saw, downloadable from the run page for 7 days.

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, 17 minutes past the hour
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  visit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_URL: https://batch-monitor.streamlit.app
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        timeout-minutes: 6
        run: pip install playwright

      - name: Visit the app and check the dashboard renders
        timeout-minutes: 7
        run: |
          python - <<'PY'
          import os, sys, time
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          TITLE = "Batch performance monitor"
          WAKE_BUTTON = "Yes, get this app back up"  # matched as a substring, so the "!" is optional
          WINDOW_SECONDS = 210

          def dashboard_found(page):
              for frame in page.frames:  # the dashboard sits inside nested frames
                  try:
                      if frame.get_by_text(TITLE).count():
                          return True
                  except Exception:
                      pass
              return False

          def click_wake_button(page):
              for frame in page.frames:
                  try:
                      button = frame.get_by_role("button", name=WAKE_BUTTON)
                      if button.count():
                          button.first.click()
                          return True
                  except Exception:
                      pass
              return False

          with sync_playwright() as p:
              browser = p.chromium.launch(channel="chrome")  # Chrome comes preinstalled on the runner
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto(url, wait_until="domcontentloaded", timeout=60_000)

              # Look for the wake button on every pass, not just once, so a
              # sleep page that loads slowly still gets woken.
              deadline = time.time() + WINDOW_SECONDS
              while time.time() < deadline and not dashboard_found(page):
                  if click_wake_button(page):
                      print("App was asleep. Clicked the wake button.")
                  page.wait_for_timeout(5_000)

              ok = dashboard_found(page)
              if ok:
                  print("Dashboard rendered.")
                  page.wait_for_timeout(15_000)  # stay long enough to count as a visit
              else:
                  print(f"Dashboard did not render within {WINDOW_SECONDS} seconds.")

              try:
                  page.screenshot(path="keep-awake.png")
              except Exception as error:
                  print(f"Could not save a screenshot: {error}")
              browser.close()
              sys.exit(0 if ok else 1)
          PY

      - name: Keep a screenshot of the visit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keep-awake-screenshot
          path: keep-awake.png
          retention-days: 7
          if-no-files-found: ignore
